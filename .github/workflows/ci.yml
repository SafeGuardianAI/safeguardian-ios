name: SafeGuardian Nova CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (iOS + macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Check prerequisites
        run: just check

      - name: Build iOS (no signing)
        run: |
          xcodebuild \
            -project SafeGuardian.xcodeproj \
            -scheme "SafeGuardian (iOS)" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -jobs 4 \
            build 2>&1 | xcpretty --color || exit ${PIPESTATUS[0]}

      - name: Build macOS (no signing)
        run: just build

      - name: Verify no debug symbols in Release binary
        run: just verify-release-clean
